<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatMitra AI — Admin Panel V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B1220; --card:#12192B; --line:#25324A; --ink:#F2F5FA; --ink-soft:#8B96AC;
    --trust-1:#123A73; --trust-2:#1F5AAE; --trust-3:#3E82D6; --gold:#E8B23D; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); min-height:100%; }
  .wrap{ max-width:640px; margin:0 auto; padding:24px 18px 60px; }
  h1{ font-family:'Manrope',sans-serif; font-size:19px; margin:0 0 4px; }
  .sub{ font-size:12px; color:var(--ink-soft); margin:0 0 20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label{ font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin:0 0 6px; }
  input, textarea, select{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:10px;
    padding:11px 13px; font-size:13.5px; font-family:'Inter',sans-serif; }
  textarea{ resize:vertical; }
  .primary{ width:100%; margin-top:10px; padding:13px; border:none; border-radius:11px; color:#fff; font-weight:700; font-size:14px;
    background:#1F5AAE; cursor:pointer; }
  .primary.danger{ background:#B23D3D; }
  .primary:disabled{ opacity:.5; cursor:not-allowed; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabbtn{ flex:1; min-width:100px; padding:11px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:10px;
    font-weight:700; font-size:12.5px; cursor:pointer; }
  .tabbtn.active{ background:#1F5AAE; color:#fff; border-color:#1F5AAE; }
  .tview{ display:none; } .tview.active{ display:block; }
  .ticket{ border-bottom:1px solid var(--line); padding:12px 0; }
  .ticket:last-child{ border-bottom:none; }
  .t-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .t-subject{ font-weight:700; font-size:13.5px; }
  .t-status{ font-size:9px; font-weight:800; padding:3px 8px; border-radius:20px; flex-shrink:0; }
  .t-status.open{ background:rgba(232,178,61,.15); color:var(--gold); }
  .t-status.replied{ background:rgba(31,168,85,.15); color:#5FE0A0; }
  .t-meta{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .t-msg{ font-size:12.5px; margin-top:8px; color:#D8DEEA; }
  .t-reply-box{ margin-top:10px; background:var(--bg); border-radius:10px; padding:10px 12px; font-size:12px; }
  .t-reply-box b{ color:#5FE0A0; }
  .reply-form{ margin-top:10px; display:none; }
  .reply-form.show{ display:block; }
  .reply-btn{ background:none; border:1px solid var(--trust-3); color:var(--trust-3); padding:7px 14px; border-radius:8px;
    font-size:11.5px; font-weight:700; margin-top:8px; cursor:pointer; }
  .msg{ font-size:12px; border-radius:10px; padding:10px 12px; margin-top:10px; display:none; }
  .msg.ok{ background:#123A2E; color:#7FE0B8; display:block; }
  .msg.err{ background:#3A1414; color:#FF9B9B; display:block; }
  .msg.warn{ background:#3A2E12; color:var(--gold); display:block; }
  .empty{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding:20px; }
  #loginGate{ text-align:center; padding-top:60px; }
  #loginGate button{ margin-top:20px; padding:13px 24px; background:#1F5AAE; color:#fff; border:none; border-radius:11px; font-weight:700; cursor:pointer; }
  .uid-copy{ font-family:monospace; font-size:10px; color:var(--ink-soft); word-break:break-all; margin-top:4px; }
  .push-status{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; }
  .checkrow{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--ink-soft); }
  .checkrow input{ width:auto; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loginGate">
    <h1>🔐 BharatMitra Admin Panel V2</h1>
    <p class="sub">Sirf authorized admin ke liye</p>
    <button onclick="handleAdminLogin()">Google se Login Karein</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="adminPanel" style="display:none">
    <h1>Admin Panel</h1>
    <p class="sub" id="adminEmailShow"></p>

    <div class="tabs">
      <button class="tabbtn active" data-t="tickets" onclick="switchTab('tickets')">Tickets</button>
      <button class="tabbtn" data-t="notify" onclick="switchTab('notify')">Ek User Ko Bhejein</button>
      <button class="tabbtn" data-t="broadcast" onclick="switchTab('broadcast')">Sabko Bhejein</button>
    </div>

    <div class="tview active" id="view-tickets">
      <div class="card" id="ticketsList"><div class="empty">Load ho raha hai...</div></div>
    </div>

    <div class="tview" id="view-notify">
      <div class="card">
        <label>User ka UID (ticket list se copy karein)</label>
        <input type="text" id="notifUid" placeholder="user ka UID paste karein">
        <label style="margin-top:12px">Title</label>
        <input type="text" id="notifTitle" placeholder="Jaise: Naya feature aa gaya!">
        <label style="margin-top:12px">Message</label>
        <textarea id="notifMsg" rows="4" placeholder="Notification ka message likhein..."></textarea>
        <div class="checkrow"><input type="checkbox" id="notifPushToo" checked> <label style="margin:0">Push notification bhi bhejein (app band ho tab bhi mile)</label></div>
        <button class="primary" onclick="sendDirectNotification()">Notification Bhejein</button>
        <div class="msg" id="notifStatus"></div>
        <div class="push-status" id="notifPushStatus"></div>
      </div>
    </div>

    <div class="tview" id="view-broadcast">
      <div class="card">
        <label>Title</label>
        <input type="text" id="bcTitle" placeholder="Jaise: BharatMitra AI me naya update!">
        <label style="margin-top:12px">Message</label>
        <textarea id="bcMsg" rows="4" placeholder="Sabhi users ko jo message bhejna hai..."></textarea>
        <button class="primary danger" onclick="sendBroadcast()">🔊 Sabhi Users Ko Push Bhejein</button>
        <div class="msg" id="bcStatus"></div>
        <div class="push-status">Ye sirf push notification bhejta hai (app ke andar notification list me save nahi hota) — sirf jinke phone me push permission ON hai unhi tak pahunchega.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB0fRD6iZSylf0_GR-DfA97qCv2xMKf5jQ",
    authDomain: "bharatmitra-ai.firebaseapp.com",
    projectId: "bharatmitra-ai",
    storageBucket: "bharatmitra-ai.firebasestorage.app",
    messagingSenderId: "450649379295",
    appId: "1:450649379295:web:94159805b5c47cc6aef46a",
    measurementId: "G-049Z2PGWFS"
  };
  const ADMIN_EMAIL = "kanhagirihspt1@gmail.com";

  // ===== OneSignal (push notifications) =====
  // App ID is public/safe to keep here. REST API Key is a SECRET — anyone with it can send
  // unlimited push to all your users. Paste it below ONLY if this file stays private
  // (not committed to a public GitHub repo). Get it from OneSignal -> Settings -> Keys & IDs.
  const ONESIGNAL_APP_ID = "1df37ef9-c84f-4271-8568-01476b1a02ff";
  const ONESIGNAL_REST_API_KEY = ""; // Keep REST API keys on a trusted backend only.

  async function sendOneSignalPush(opts){
    // opts: { title, message, externalId } for one user, or { title, message, toAll: true } for everyone
    if (!ONESIGNAL_REST_API_KEY || ONESIGNAL_REST_API_KEY.indexOf('PASTE_') === 0) {
      return { skipped: true, reason: 'REST API Key abhi set nahi hai' };
    }
    const body = {
      app_id: ONESIGNAL_APP_ID,
      target_channel: 'push',
      headings: { en: opts.title },
      contents: { en: opts.message }
    };
    if (opts.toAll) {
      body.included_segments = ['Subscribed Users'];
    } else {
      body.include_aliases = { external_id: [String(opts.externalId)] };
    }
    const res = await fetch('https://onesignal.com/api/v1/notifications', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        'Authorization': 'Key ' + ONESIGNAL_REST_API_KEY
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok || data.errors) throw new Error(JSON.stringify(data.errors || data));
    return data;
  }

  let auth = null, provider = null, fb = null, fs = null, db = null, ready = false;

  async function initFirebase(){
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js");
      fb = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js");
      fs = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js");
      const app = appMod.initializeApp(firebaseConfig);
      auth = fb.getAuth(app);
      db = fs.getFirestore(app);
      provider = new fb.GoogleAuthProvider();
      ready = true;
      fb.onAuthStateChanged(auth, function(user){
        if (user && user.email === ADMIN_EMAIL) {
          document.getElementById('loginGate').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          document.getElementById('adminEmailShow').textContent = 'Logged in as ' + user.email;
          loadTickets();
        } else if (user) {
          document.getElementById('loginMsg').className = 'msg err';
          document.getElementById('loginMsg').textContent = 'Ye account admin nahi hai: ' + user.email;
          fb.signOut(auth);
        } else {
          document.getElementById('loginGate').style.display = 'block';
          document.getElementById('adminPanel').style.display = 'none';
        }
      });
    } catch (e) { console.error('Firebase init failed', e); }
  }
  initFirebase();

  async function handleAdminLogin(){
    if (!ready) return;
    try { await fb.signInWithPopup(auth, provider); }
    catch (e) { document.getElementById('loginMsg').className = 'msg err'; document.getElementById('loginMsg').textContent = 'Error: ' + e.message; }
  }

  async function handleAdminLogout(){
    try {
      if (auth) await fb.signOut(auth);
    } catch (e) {
      console.error('Logout failed', e);
    }
  }

  function switchTab(name){
    document.querySelectorAll('.tabbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.t === name); });
    document.querySelectorAll('.tview').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
  }

  async function loadTickets(){
    const list = document.getElementById('ticketsList');
    try {
      const snap = await fs.getDocs(fs.collection(db, 'tickets'));
      if (snap.empty) { list.innerHTML = '<div class="empty">Koi ticket nahi hai</div>'; return; }
      let docs = snap.docs.slice().sort(function(a,b){
        const ta = a.data().createdAt ? a.data().createdAt.toMillis() : 0;
        const tb = b.data().createdAt ? b.data().createdAt.toMillis() : 0;
        return tb - ta;
      });
      list.innerHTML = docs.map(function(d){
        const t = d.data();
        const statusClass = t.status === 'replied' ? 'replied' : 'open';
        return '<div class="ticket">' +
          '<div class="t-top"><div class="t-subject">' + t.subject + '</div><div class="t-status ' + statusClass + '">' + (t.status === 'replied' ? 'REPLIED' : 'OPEN') + '</div></div>' +
          '<div class="t-meta">' + (t.userName || 'No name') + ' · ' + t.userEmail + '</div>' +
          '<div class="uid-copy">UID: ' + t.userId + '</div>' +
          '<div class="t-msg">' + t.message + '</div>' +
          (t.reply ? '<div class="t-reply-box"><b>Aapka Reply:</b> ' + t.reply + '</div>' : '') +
          '<button class="reply-btn" data-tid="' + d.id + '" onclick="toggleReply(this.dataset.tid)">' + (t.reply ? 'Reply Edit Karein' : 'Reply Karein') + '</button>' +
          '<div class="reply-form" id="rf-' + d.id + '">' +
            '<textarea id="ri-' + d.id + '" rows="3" placeholder="Apna reply likhein...">' + (t.reply || '') + '</textarea>' +
            '<button class="primary" data-tid="' + d.id + '" data-uid="' + t.userId + '" data-subj="' + t.subject.replace(/"/g,'&quot;') + '" onclick="sendReply(this.dataset.tid, this.dataset.uid, this.dataset.subj)">Reply Bhejein</button>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) {
      list.innerHTML = '<div class="empty">Load nahi ho paya: ' + e.message + '</div>';
    }
  }

  function toggleReply(id){
    document.getElementById('rf-' + id).classList.toggle('show');
  }

  async function sendReply(ticketId, userId, subject){
    const replyText = document.getElementById('ri-' + ticketId).value.trim();
    if (!replyText) { alert('Reply likhein pehle'); return; }
    try {
      await fs.updateDoc(fs.doc(db, 'tickets', ticketId), { reply: replyText, status: 'replied' });
      await fs.addDoc(fs.collection(db, 'notifications'), {
        userId: userId,
        title: 'Reply: ' + subject,
        message: replyText,
        read: false,
        createdAt: fs.serverTimestamp()
      });
      try { await sendOneSignalPush({ title: 'Reply: ' + subject, message: replyText, externalId: userId }); } catch (e) { console.error('Push failed', e); }
      loadTickets();
    } catch (e) { alert('Error: ' + e.message); }
  }

  async function sendDirectNotification(){
    const uid = document.getElementById('notifUid').value.trim();
    const title = document.getElementById('notifTitle').value.trim();
    const message = document.getElementById('notifMsg').value.trim();
    const pushToo = document.getElementById('notifPushToo').checked;
    const statusBox = document.getElementById('notifStatus');
    const pushStatusBox = document.getElementById('notifPushStatus');
    pushStatusBox.textContent = '';
    if (!uid || !title || !message) { statusBox.className = 'msg err'; statusBox.textContent = 'Sab fields bharein'; return; }
    try {
      await fs.addDoc(fs.collection(db, 'notifications'), {
        userId: uid, title: title, message: message, read: false, createdAt: fs.serverTimestamp()
      });
      statusBox.className = 'msg ok'; statusBox.textContent = 'Notification bhej diya ✅ (app ke andar dikhega)';
      if (pushToo) {
        try {
          const result = await sendOneSignalPush({ title: title, message: message, externalId: uid });
          if (result.skipped) { pushStatusBox.textContent = '⚠️ Push nahi bheja: ' + result.reason; }
          else { pushStatusBox.textContent = '📲 Push bhi bhej diya (app band ho tab bhi milega)'; }
        } catch (e) { pushStatusBox.textContent = '⚠️ Push fail hua: ' + e.message; }
      }
      document.getElementById('notifUid').value = '';
      document.getElementById('notifTitle').value = '';
      document.getElementById('notifMsg').value = '';
    } catch (e) { statusBox.className = 'msg err'; statusBox.textContent = 'Error: ' + e.message; }
  }

  async function sendBroadcast(){
    const title = document.getElementById('bcTitle').value.trim();
    const message = document.getElementById('bcMsg').value.trim();
    const statusBox = document.getElementById('bcStatus');
    if (!title || !message) { statusBox.className = 'msg err'; statusBox.textContent = 'Title aur message bharein'; return; }
    if (!confirm('Ye SABHI users ko push notification bhejega. Pakka bhejna hai?')) return;
    try {
      const result = await sendOneSignalPush({ title: title, message: message, toAll: true });
      if (result.skipped) {
        statusBox.className = 'msg warn'; statusBox.textContent = '⚠️ ' + result.reason + ' — OneSignal REST API Key add karein pehle.';
        return;
      }
      statusBox.className = 'msg ok'; statusBox.textContent = '✅ Sabko push bhej diya (' + (result.recipients || '?') + ' recipients)';
      document.getElementById('bcTitle').value = '';
      document.getElementById('bcMsg').value = '';
    } catch (e) { statusBox.className = 'msg err'; statusBox.textContent = 'Error: ' + e.message; }
  }
</script>
</body>
</html>
