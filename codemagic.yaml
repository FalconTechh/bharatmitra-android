workflows:
  android-build:
    name: BharatMitra Android Build (Debug/Testing)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      groups: []
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Add Android platform (first build only)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Use a fixed debug keystore (keeps SHA-1 stable across builds for Google Sign-In)
        script: |
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "WARNING: debug.keystore not found at repo root — Gradle will auto-generate one instead, which means Google Sign-In's SHA-1 may change between builds. See SETUP-GUIDE.md Step 3."
          fi

      - name: Copy Firebase config (used by web SDK inside the app, not native)
        script: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Generate app icon + splash screen from assets/
        script: npx @capacitor/assets generate --android

      - name: Sync web assets to native project
        script: npx cap sync android

      - name: Force native Android 12+ splash background to match our navy theme (avoids black flash)
        script: |
          python3 - <<'PYEOF'
          import re, glob, os
          COLOR = "#FF00071C"  # ARGB navy matching the in-app boot splash
          for values_dir in glob.glob("android/app/src/main/res/values*"):
              styles_path = os.path.join(values_dir, "styles.xml")
              if not os.path.isfile(styles_path):
                  continue
              content = open(styles_path, encoding="utf-8").read()
              if "windowSplashScreenBackground" in content:
                  content = re.sub(
                      r'(<item name="windowSplashScreenBackground">)[^<]*(</item>)',
                      r"\g<1>%s\g<2>" % COLOR, content)
              elif "</style>" in content:
                  content = content.replace(
                      "</style>", '    <item name="windowSplashScreenBackground">%s</item>\n</style>' % COLOR, 1)
              open(styles_path, "w", encoding="utf-8").write(content)
          PYEOF

      - name: Add background location + notification permissions to AndroidManifest.xml
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Register custom URL scheme for Google Sign-In deep-link redirect
        script: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          if "oauth2redirect" not in content:
              anchor = 'android.intent.category.LAUNCHER" />\n            </intent-filter>'
              addition = anchor + '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="com.bharatmitra.ai" android:path="/oauth2redirect" />
            </intent-filter>'''
              if anchor in content:
                  content = content.replace(anchor, addition, 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
              else:
                  print("WARNING: could not find LAUNCHER intent-filter anchor to attach Google Sign-In redirect scheme")
          PYEOF

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - kanhagirihspt1@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: BharatMitra Android Release (Play Store AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      # Create this group in CodeMagic -> Environment variables, containing (all marked "Secure"):
      #   CM_KEYSTORE            = contents of release.keystore.base64.txt
      #   CM_KEYSTORE_PASSWORD   = your release keystore password
      #   CM_KEY_ALIAS           = bharatmitra
      #   CM_KEY_PASSWORD        = your release key password
      # Never put these values directly in this file or commit the .keystore file to GitHub.
      groups:
        - release_signing
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Add Android platform (first build only)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy Firebase config (used by web SDK inside the app, not native)
        script: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Generate app icon + splash screen from assets/
        script: npx @capacitor/assets generate --android

      - name: Sync web assets to native project
        script: npx cap sync android

      - name: Force native Android 12+ splash background to match our navy theme (avoids black flash)
        script: |
          python3 - <<'PYEOF'
          import re, glob, os
          COLOR = "#FF00071C"  # ARGB navy matching the in-app boot splash
          for values_dir in glob.glob("android/app/src/main/res/values*"):
              styles_path = os.path.join(values_dir, "styles.xml")
              if not os.path.isfile(styles_path):
                  continue
              content = open(styles_path, encoding="utf-8").read()
              if "windowSplashScreenBackground" in content:
                  content = re.sub(
                      r'(<item name="windowSplashScreenBackground">)[^<]*(</item>)',
                      r"\g<1>%s\g<2>" % COLOR, content)
              elif "</style>" in content:
                  content = content.replace(
                      "</style>", '    <item name="windowSplashScreenBackground">%s</item>\n</style>' % COLOR, 1)
              open(styles_path, "w", encoding="utf-8").write(content)
          PYEOF

      - name: Add background location + notification permissions to AndroidManifest.xml
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi

      - name: Register custom URL scheme for Google Sign-In deep-link redirect
        script: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          if "oauth2redirect" not in content:
              anchor = 'android.intent.category.LAUNCHER" />\n            </intent-filter>'
              addition = anchor + '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="com.bharatmitra.ai" android:path="/oauth2redirect" />
            </intent-filter>'''
              if anchor in content:
                  content = content.replace(anchor, addition, 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
              else:
                  print("WARNING: could not find LAUNCHER intent-filter anchor to attach Google Sign-In redirect scheme")
          PYEOF

      - name: Decode release keystore from secure environment variable
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "ERROR: CM_KEYSTORE env var not set. Add the release_signing group in CodeMagic with CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD. See SETUP-GUIDE.md."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 -d > /tmp/release.keystore

      - name: Build signed release AAB (for Play Store upload)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"

    artifacts:
      - android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - kanhagirihspt1@gmail.com
        notify:
          success: true
          failure: true
